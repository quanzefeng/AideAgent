          - heading "Embed/output weights" [level=2] [ref=e666]:
            - link [ref=e667] [cursor=pointer]:
              - /url: "#embedoutput-weights"
          - paragraph [ref=e672]: Some of these quants (Q3_K_XL, Q4_K_L etc) are the standard quantization method with the embeddings and output weights quantized to Q8_0 instead of what they would normally default to.
          - heading "Downloading using huggingface-cli" [level=2] [ref=e673]:
            - link [ref=e674] [cursor=pointer]:
              - /url: "#downloading-using-huggingface-cli"
          - group [ref=e679]:
            - generic "Click to view download instructions" [ref=e680]
          - heading "ARM/AVX information" [level=2] [ref=e681]:
            - link [ref=e682] [cursor=pointer]:
              - /url: "#armavx-information"
          - paragraph [ref=e687]: Previously, you would download Q4_0_4_4/4_8/8_8, and these would have their weights interleaved in memory in order to improve performance on ARM and AVX machines by loading up more data in one pass.
          - paragraph [ref=e688]:
            - text: Now, however, there is something called "online repacking" for weights. details in
            - link "this PR" [ref=e689] [cursor=pointer]:
              - /url: https://github.com/ggml-org/llama.cpp/pull/9921
            - text: . If you use Q4_0 and your hardware would benefit from repacking weights, it will do it automatically on the fly.
          - paragraph [ref=e690]:
            - text: As of llama.cpp build
            - link "b4282" [ref=e691] [cursor=pointer]:
              - /url: https://github.com/ggml-org/llama.cpp/releases/tag/b4282
            - text: you will not be able to run the Q4_0_X_X files and will instead need to use Q4_0.
          - paragraph [ref=e692]:
            - text: Additionally, if you want to get slightly better quality for , you can use IQ4_NL thanks to
            - link "this PR" [ref=e693] [cursor=pointer]:
              - /url: https://github.com/ggml-org/llama.cpp/pull/10541
            - text: which will also repack the weights for ARM, though only the 4_4 for now. The loading time may be slower but it will result in an overall speed incrase.
          - group [ref=e694]:
            - generic "Click to view Q4_0_X_X information (deprecated" [ref=e695]
          - heading "Which file should I choose?" [level=2] [ref=e696]:
            - link [ref=e697] [cursor=pointer]:
              - /url: "#which-file-should-i-choose"
          - group [ref=e702]:
            - generic "Click here for details" [ref=e703]
          - heading "Credits" [level=2] [ref=e704]:
            - link [ref=e705] [cursor=pointer]:
              - /url: "#credits"
          - paragraph [ref=e710]: Thank you kalomaze and Dampf for assistance in creating the imatrix calibration dataset.
          - paragraph [ref=e711]: Thank you ZeroWw for the inspiration to experiment with embed/output.
